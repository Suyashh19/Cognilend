# Global settings. Values marked TBD are set (with evidence) in the step named.
seed: 42

paths:
  synthetic_raw: data/synthetic/loans_raw.csv              # generated by cognilend.data.synthetic (seed 42)
  team_synthetic_raw: data/synthetic/loan_applications_raw.csv   # earlier team file, reference only
  loan_csv: data/raw/Loan.csv            # not yet supplied (see docs/progress/step_00.md)
  models: artifacts/models
  encoders: artifacts/encoders
  reports: artifacts/reports
  database_url: sqlite:///data/processed/cognilend.db   # PostgreSQL-compatible schema
  fallback_log: artifacts/fallback/decisions_fallback.jsonl   # decisions whose DB write failed (replayable)

split:                                   # synopsis: 70/30 (train / val+test)
  train: 0.70
  val: 0.15
  test: 0.15
  stratify: true

tree:                                    # NFR constraints on the explainable model
  criterion: entropy
  max_depth: 4
  max_total_nodes: 15
  max_generalization_gap: 0.15
  entropy_tolerance: 1.0e-9

kpi:
  min_val_accuracy: 0.80

confidence:                              # Step 5: Bayesian leaf confidence + routing
  version: confidence_v1
  prior: [1, 1]                          # Beta(a, b) prior on the leaf approval rate
  credible_interval: 0.90
  target_auto_accuracy: 0.90             # wanted accuracy on auto-decided cases (validation)
  max_review_share: 0.50                 # KPI: majority auto-cleared
  tau_grid: {start: 0.50, stop: 0.99, step: 0.01}
  tau: 0.70                              # tuned on validation by python -m cognilend.ml.confidence (routing.md)
  n_min: 30                              # leaves supported by fewer real training rows -> human review

preprocess:
  version: preprocessor_v1
  iqr_factor: 3.0
  home_tenure_years_max: 30          # Home-loan tenures <= this were keyed in years -> x12
  secured_loan_types: [Home, Vehicle]
  continuous: [cibil_score, work_experience, total_income, existing_emi, loan_amount, loan_tenure,
               foir, loan_to_income, collateral_coverage]
  ordinal: [dependents]              # passed through unscaled (codes 0-3)
  binary: [is_new_to_credit, is_secured, has_coapplicant]
  nominal: [Employment_Type, Loan_Type]   # one-hot, unscaled
  # Computed and kept for rules/audit, but NOT model inputs:
  #   age_at_maturity -> carries age, and Age_Band is protected (docs/data_decision.md §5)
  #   ltv             -> undefined for unsecured loans; collateral_coverage carries the same information
  facts_only: [age_at_maturity, ltv, proposed_emi]
  smote: {k_neighbors: 5}

model:
  version: dt_v1
  min_samples_leaf: [1, 5, 10, 20, 50, 100, 200]
  class_weight: [null, balanced]
  smote: [false, true]
  top_k_features: [null, 5, 8, 11]   # null = all features; else top-k by information gain on train

benchmark:
  cv_folds: 5
  random_forest: {n_estimators: [300], max_depth: [null, 8, 12], min_samples_leaf: [1, 5, 10]}
  xgboost: {n_estimators: [300], max_depth: [3, 4, 6], learning_rate: [0.05, 0.1]}
  gradient_boosting: {n_estimators: [200], max_depth: [2, 3], learning_rate: [0.05, 0.1]}

database:
  busy_timeout_s: 60       # SQLite: how long a writer waits for BEGIN IMMEDIATE
  pool_size: 10
  max_overflow: 60
