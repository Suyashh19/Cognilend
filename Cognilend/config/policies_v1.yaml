# CogniLend credit policy, version v1.
# A rule FIRES when its condition is true.  HARD fired -> immediate REJECT, ML never called (FR-6).
# SOFT fired (and no HARD) -> human REVIEW.  The ML layer is consulted only when outcome = PASS or REVIEW.
#
# Machine-readable condition:  <fact> <op> <threshold | threshold_fact>
#   unless:        rule is exempt when this boolean fact is true
#   applies_when:  rule is only evaluated when every listed fact equals the given value
# Thresholds are illustrative bank-policy values for an academic prototype unless the source says regulatory.
# docs/rule_justification.md (generated by scripts/rule_analysis.py) analyses each threshold on the data.
version: v1
effective_from: 2026-10-15

indicative_rates: {Home: 0.085, Vehicle: 0.095, Personal: 0.115, Business: 0.13}   # annual, for proposed EMI

parameters:
  foir_slabs:                     # FOIR limit by total monthly income band
    - {income_below: 50000, max_foir: 0.50}
    - {income_upto: 100000, max_foir: 0.55}
    - {income_above: 100000, max_foir: 0.65}
  ltv_slabs:                      # RBI LTV ceilings for housing loans, by loan amount
    - {amount_upto: 3000000, max_ltv: 0.90}
    - {amount_upto: 7500000, max_ltv: 0.80}
    - {amount_above: 7500000, max_ltv: 0.75}
  min_experience: {Salaried: 1, SEP: 3, SENP: 3}
  foir_borderline_margin: 0.05    # within 5 points under the FOIR limit -> review
  secured_loan_types: [Home, Vehicle]
  fraud_registry: config/fraud_registry.yaml

rules:
  - id: R01
    type: HARD
    name: Minimum age
    condition: age < 21
    fact: age
    op: '<'
    threshold: 21
    reason: 'R01 minimum age: applicant is {age:.0f}, minimum is {threshold}'
    rationale: >-
      Applicants must be able to enter a binding contract and show an income history. 21 is the common entry
      age for unsecured retail lending in Indian banks; 18 is the legal minimum, so 21 is a policy choice.
    source: Bank credit policy (typical Indian retail practice); Indian Contract Act 1872 s.11 for the legal floor.

  - id: R02
    type: HARD
    name: Fraud / blacklist registry hit
    condition: blacklist_hit == true
    fact: blacklist_hit
    op: '=='
    threshold: true
    reason: 'R02 fraud registry: applicant {applicant_id} is on the internal fraud / wilful-defaulter list'
    rationale: >-
      Lending to a known fraudster or wilful defaulter is prohibited regardless of score. The registry is a
      file (config/fraud_registry.yaml) so it can be updated without a code change. Not evaluated when the
      application has no Applicant_ID.
    source: RBI Master Direction on Wilful Defaulters and Large Defaulters (2024); RBI Master Direction on Frauds.

  - id: R03
    type: HARD
    name: Age at loan maturity
    condition: age_at_maturity > 65
    fact: age_at_maturity
    op: '>'
    threshold: 65
    reason: 'R03 age at maturity: loan would end at age {age_at_maturity:.1f}, limit is {threshold}'
    rationale: >-
      Repayment must finish while the applicant still has earning capacity. A single cap of 65 replaces the
      earlier 60 (salaried) / 65 (self-employed) split; the data analysis in docs/rule_justification.md shows
      how many applicants each cutoff rejects. Flagged for tuning in the October plan.
    source: Bank credit policy (typical home-loan maximum age at maturity 60-70 in Indian banks).

  - id: R04
    type: HARD
    name: Minimum bureau score
    condition: cibil_score < 650 unless new_to_credit
    fact: cibil_score
    op: '<'
    threshold: 650
    unless: new_to_credit
    reason: 'R04 bureau score: CIBIL {cibil_score:.0f} is below the minimum of {threshold}'
    rationale: >-
      Scores below 650 indicate recent delinquency. New-to-credit applicants (CIBIL -1) have no score, are
      exempt here and are routed to review by S01 instead of being rejected for lack of history.
    source: Bank credit policy (650 is a widely used cut-off; TransUnion CIBIL score bands).

  - id: R05
    type: HARD
    name: FOIR limit by income band
    condition: foir > foir_limit
    fact: foir
    op: '>'
    threshold_fact: foir_limit
    reason: 'R05 affordability: FOIR {foir:.0%} exceeds the {foir_limit:.0%} limit for income Rs {total_income:,.0f}/month'
    rationale: >-
      Fixed obligations (existing EMIs plus the proposed EMI) must leave enough income to live on. Higher
      incomes can carry a larger share, hence the slabs 50% / 55% / 65%.
    source: Bank credit policy (FOIR 50-65% is standard Indian underwriting practice).

  - id: R06
    type: HARD
    name: RBI LTV cap for housing loans
    condition: ltv > ltv_cap when loan_type == Home
    fact: ltv
    op: '>'
    threshold_fact: ltv_cap
    applies_when: {loan_type: Home}
    reason: 'R06 LTV: loan is {ltv:.0%} of property value, RBI cap for this loan size is {ltv_cap:.0%}'
    rationale: >-
      Regulatory ceiling on loan-to-value for housing loans: 90% up to Rs 30 lakh, 80% for Rs 30-75 lakh,
      75% above Rs 75 lakh.
    source: RBI Master Circular - Housing Finance (LTV ceilings for individual housing loans).

  - id: R07
    type: HARD
    name: Minimum monthly income
    condition: total_income < 15000
    fact: total_income
    op: '<'
    threshold: 15000
    reason: 'R07 minimum income: total income Rs {total_income:,.0f}/month is below Rs {threshold:,}'
    rationale: >-
      Below this income even a small EMI leaves too little for living costs. Co-applicant income is clubbed.
    source: Bank credit policy (typical minimum income for retail loans).

  - id: S01
    type: SOFT
    name: New to credit
    condition: new_to_credit == true
    fact: new_to_credit
    op: '=='
    threshold: true
    reason: 'S01 new to credit: no bureau history (CIBIL -1); verify income and banking behaviour manually'
    rationale: >-
      Rejecting applicants only because they have no history would exclude first-time borrowers. A person
      reviews alternative evidence instead.
    source: RBI financial-inclusion objectives; bank credit policy.

  - id: S02
    type: SOFT
    name: Work experience below minimum
    condition: work_experience < min_experience
    fact: work_experience
    op: '<'
    threshold_fact: min_experience
    reason: 'S02 experience: {work_experience:.0f} years is below the {min_experience} years expected for {employment_type}'
    rationale: >-
      Short employment or business vintage raises income-continuity risk but is not disqualifying (job
      changes, new professionals). Salaried 1 year; self-employed 3 years of ITR.
    source: Bank credit policy (ITR vintage norms for self-employed borrowers).

  - id: S03
    type: SOFT
    name: Borderline FOIR
    condition: foir_borderline == true
    fact: foir_borderline
    op: '=='
    threshold: true
    reason: 'S03 borderline affordability: FOIR {foir:.0%} is within {margin:.0%} of the {foir_limit:.0%} limit'
    rationale: >-
      Applicants just under the FOIR limit are one rate rise or one new obligation away from breaching it.
      A person confirms the obligations before approval.
    source: Bank credit policy.

  - id: S04
    type: SOFT
    name: Missing key information
    condition: missing_key_data == true
    fact: missing_key_data
    op: '=='
    threshold: true
    reason: 'S04 missing information: {missing_fields} not provided; request documents before deciding'
    rationale: >-
      Optional fields that the rules or model rely on (bureau score, existing EMIs, experience, collateral
      value for a secured loan) are never guessed for a live decision; the case goes to a person.
    source: RBI Fair Practices Code (lenders must assess applications on complete information).
